<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>阳光基地劳动产品资源配送地图</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="map-shell">
      <div id="map" class="map" aria-label="阳光基地劳动产品资源配送地图"></div>

      <div class="floating-topbar floating-topbar--metrics-only">
        <div class="floating-topbar__meta">
          <button class="meta-chip meta-chip--filter is-active" id="filterBaseBtn" type="button" aria-pressed="true">
            服务中心 <strong id="metricStationCount">0</strong>
          </button>
          <button class="meta-chip meta-chip--filter is-active" id="filterCenterBtn" type="button" aria-pressed="true">
            调配中心 <strong id="metricCenterCount">0</strong>
          </button>
          <span class="meta-chip">援助对象 <strong id="metricPeopleCount">0</strong></span>
        </div>
      </div>

      <aside class="floating-region-panel">
        <div class="floating-region-panel__head">
          <h2>阳光基地劳动产品资源配送地图</h2>
          <span class="floating-region-panel__count" id="regionPanelCount">0 个区域</span>
        </div>
        <button class="region-all-button is-active" id="regionAllBtn" type="button">
          <span>全部区域</span>
          <strong id="metricDistrictCount">0</strong>
        </button>
        <div class="region-panel-list" id="regionPanelList"></div>
      </aside>

      <button class="upload-fab" id="uploadFabBtn" type="button" aria-label="上传 Excel">
        +
      </button>

      <div class="upload-modal" id="uploadModal" hidden>
        <div class="upload-modal__backdrop" id="uploadModalBackdrop"></div>
        <section class="upload-modal__card" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
          <div class="upload-modal__head">
            <h2 id="uploadModalTitle">上传 Excel 表格</h2>
            <button class="upload-modal__close" id="uploadCancelBtn" type="button" aria-label="关闭">×</button>
          </div>
          <p class="upload-modal__desc">
            上传包含基地站信息的 Excel 表格后，系统会自动读取内容，优先匹配并更新现有点位；如果表里包含带坐标的新点位，也会同步新增到地图上。
          </p>
          <label class="upload-field">
            <span>选择文件</span>
            <input id="uploadFileInput" type="file" accept=".xls,.xlsx,.csv" />
          </label>
          <div class="upload-modal__actions">
            <button class="upload-btn upload-btn--ghost" id="uploadDismissBtn" type="button">取消</button>
            <button class="upload-btn upload-btn--primary" id="uploadSubmitBtn" type="button">提交</button>
          </div>
          <div class="upload-modal__status" id="uploadStatus"></div>
        </section>
      </div>

    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="./stations-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
