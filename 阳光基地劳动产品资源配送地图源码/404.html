<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面未找到</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(180deg, #edf5fb, #dce9f6);
        color: #102a43;
      }

      .card {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 56px rgba(12, 28, 42, 0.12);
      }

      h1 {
        margin: 0;
        font-size: 32px;
      }

      p {
        margin: 14px 0 0;
        line-height: 1.8;
        color: #5f7486;
      }

      a {
        display: inline-block;
        margin-top: 18px;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff7a18, #ff9f56);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>页面未找到</h1>
      <p>你访问的页面不存在，或者链接已经发生变化。</p>
      <p>你可以返回首页继续查看阳光基地劳动产品资源配送地图。</p>
      <a href="./index.html">返回首页</a>
    </main>
  </body>
</html>
